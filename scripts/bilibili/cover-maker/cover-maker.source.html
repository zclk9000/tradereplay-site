<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeReplay B站封面生成器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #070b13;
      color: #f4f7fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 4%, rgba(75, 131, 247, 0.16), transparent 34rem),
        #070b13;
    }

    main {
      width: min(1500px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 0;
      color: #8f9db2;
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 230px 110px auto;
      gap: 12px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(174, 195, 232, 0.16);
      border-radius: 16px;
      background: rgba(13, 21, 34, 0.92);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
    }

    label {
      display: grid;
      gap: 7px;
      color: #8f9db2;
      font-size: 12px;
    }

    input, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      color: #f4f7fc;
      border: 1px solid rgba(174, 195, 232, 0.2);
      border-radius: 10px;
      outline: none;
      background: #111c2b;
    }

    textarea {
      height: 66px;
      resize: vertical;
      line-height: 1.4;
    }

    input:focus, textarea:focus {
      border-color: #4b83f7;
      box-shadow: 0 0 0 3px rgba(75, 131, 247, 0.14);
    }

    .font-size-label {
      min-width: 0;
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    output {
      color: #dfe8ff;
      font-variant-numeric: tabular-nums;
    }

    .font-size-control {
      display: grid;
      grid-template-columns: 44px minmax(92px, 1fr) 44px;
      align-items: center;
      gap: 8px;
    }

    .font-size-control input[type="range"] {
      min-height: 44px;
      padding: 0;
      border: 0;
      box-shadow: none;
      accent-color: #4b83f7;
      background: transparent;
      cursor: pointer;
    }

    .step-button {
      width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid rgba(174, 195, 232, 0.2);
      background: #111c2b;
      font-size: 22px;
      font-weight: 500;
    }

    .step-button:hover {
      border-color: rgba(101, 151, 255, 0.72);
      background: #17263a;
    }

    button {
      align-self: end;
      min-height: 44px;
      padding: 0 22px;
      color: white;
      border: 0;
      border-radius: 10px;
      background: #4b83f7;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: #6597ff; }

    .canvas-shell {
      overflow: hidden;
      border: 1px solid rgba(174, 195, 232, 0.16);
      border-radius: 18px;
      background: #09101b;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.38);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
      background: #070b13;
    }

    .hint {
      margin: 12px 2px 0;
      color: #78859a;
      font-size: 12px;
    }

    @media (max-width: 820px) {
      main { width: min(100% - 24px, 1500px); padding-top: 20px; }
      header { align-items: start; flex-direction: column; }
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
    }

    body.render-only {
      width: 1600px;
      min-height: 1000px;
      overflow: hidden;
      background: #070b13;
    }

    body.render-only main {
      width: 1600px;
      margin: 0;
      padding: 0;
    }

    body.render-only header,
    body.render-only .controls,
    body.render-only .hint {
      display: none;
    }

    body.render-only .canvas-shell {
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.render-only canvas {
      width: 1600px;
      height: 1000px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>TradeReplay B站封面生成器</h1>
        <p class="intro">输入本集题目和集数，然后导出 3200 × 2000 高清 PNG。</p>
      </div>
    </header>

    <section class="controls" aria-label="封面设置">
      <label>
        本集题目（可用回车指定换行）
        <textarea id="titleInput" maxlength="34">5 分钟完成&#10;第一次模拟训练</textarea>
      </label>
      <label class="font-size-label">
        <span class="label-row"><span>标题字号</span><output id="fontSizeValue">118</output></span>
        <span class="font-size-control">
          <button class="step-button" id="fontSizeDecrease" type="button" aria-label="减小标题字号">−</button>
          <input id="fontSizeInput" type="range" min="64" max="150" step="2" value="118" aria-label="标题字号">
          <button class="step-button" id="fontSizeIncrease" type="button" aria-label="增大标题字号">＋</button>
        </span>
      </label>
      <label>
        集数
        <input id="episodeInput" value="00" maxlength="3" inputmode="numeric">
      </label>
      <button id="downloadButton" type="button">导出高清 PNG</button>
    </section>

    <div class="canvas-shell">
      <canvas id="cover" width="3200" height="2000" aria-label="封面预览"></canvas>
    </div>
    <p class="hint">建议题目 8–18 个汉字、最多两行。导出为 2 倍高清画布，所有素材只在本机处理。</p>
  </main>

  <script>
    const BACKGROUND_DATA = "__BACKGROUND_DATA__";
    const SCREEN_DATA = "__SCREEN_DATA__";
    const LOGO_DATA = "__LOGO_DATA__";

    const W = 1600;
    const H = 1000;
    const EXPORT_SCALE = 2;
    const canvas = document.querySelector("#cover");
    const ctx = canvas.getContext("2d");
    const titleInput = document.querySelector("#titleInput");
    const fontSizeInput = document.querySelector("#fontSizeInput");
    const fontSizeValue = document.querySelector("#fontSizeValue");
    const fontSizeDecrease = document.querySelector("#fontSizeDecrease");
    const fontSizeIncrease = document.querySelector("#fontSizeIncrease");
    const episodeInput = document.querySelector("#episodeInput");
    const downloadButton = document.querySelector("#downloadButton");
    const searchParams = new URLSearchParams(location.search);
    const renderOnly = searchParams.get("render") === "1";

    if (searchParams.has("title")) titleInput.value = searchParams.get("title");
    if (searchParams.has("fontSize")) {
      const requestedSize = Number(searchParams.get("fontSize"));
      fontSizeInput.value = Math.min(Number(fontSizeInput.max), Math.max(Number(fontSizeInput.min), requestedSize));
      fontSizeValue.value = fontSizeInput.value;
    }

    const images = {};

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = src;
      });
    }

    function roundedRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.roundRect(x, y, width, height, radius);
    }

    function drawImageCover(image, x, y, width, height) {
      const imageRatio = image.width / image.height;
      const targetRatio = width / height;
      let sx = 0;
      let sy = 0;
      let sw = image.width;
      let sh = image.height;

      if (imageRatio > targetRatio) {
        sw = image.height * targetRatio;
        sx = (image.width - sw) / 2;
      } else {
        sh = image.width / targetRatio;
        sy = (image.height - sh) / 2;
      }

      ctx.drawImage(image, sx, sy, sw, sh, x, y, width, height);
    }

    function wrapTitle(text, maxWidth, maxLines, fontSize) {
      const manualLines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
      const source = manualLines.length > 1 ? manualLines : [text.replace(/\s+/g, " ").trim()];
      const lines = [];

      for (const paragraph of source) {
        let current = "";
        for (const character of Array.from(paragraph)) {
          const candidate = current + character;
          if (ctx.measureText(candidate).width <= maxWidth || !current) {
            current = candidate;
          } else {
            lines.push(current.trim());
            current = character;
          }
        }
        if (current.trim()) lines.push(current.trim());
      }

      if (lines.length > maxLines) return null;
      return lines;
    }

    function fittedTitle(text) {
      ctx.letterSpacing = "-0.025em";
      const preferredSize = Number(fontSizeInput.value);
      const manualLines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);

      if (manualLines.length > 1) {
        return { lines: manualLines.slice(0, 3), size: preferredSize };
      }

      for (let size = preferredSize; size >= 76; size -= 2) {
        ctx.font = `700 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
        const lines = wrapTitle(text, 1120, 2, size);
        if (lines) return { lines, size };
      }

      ctx.font = `700 70px "PingFang SC", "Microsoft YaHei", sans-serif`;
      const lines = wrapTitle(text, 1120, 3, 70) || [text.slice(0, 30)];
      return { lines, size: 70 };
    }

    function drawCover() {
      const title = titleInput.value.trim() || "本集题目";
      const episode = (episodeInput.value.trim() || "01").padStart(2, "0");

      ctx.setTransform(EXPORT_SCALE, 0, 0, EXPORT_SCALE, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.clearRect(0, 0, W, H);
      drawImageCover(images.background, 0, 0, W, H);

      const leftShade = ctx.createLinearGradient(0, 0, 1040, 0);
      leftShade.addColorStop(0, "rgba(5, 9, 17, 0.68)");
      leftShade.addColorStop(0.58, "rgba(5, 9, 17, 0.42)");
      leftShade.addColorStop(1, "rgba(5, 9, 17, 0.02)");
      ctx.fillStyle = leftShade;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(842, 252);
      ctx.rotate(-0.038);
      ctx.shadowColor = "rgba(0, 0, 0, 0.62)";
      ctx.shadowBlur = 52;
      ctx.shadowOffsetY = 24;
      roundedRect(ctx, 0, 0, 1010, 642, 26);
      ctx.fillStyle = "rgba(8, 13, 22, 0.96)";
      ctx.fill();
      ctx.shadowColor = "transparent";
      ctx.save();
      roundedRect(ctx, 0, 0, 1010, 642, 26);
      ctx.clip();
      drawImageCover(images.screen, 0, 0, 1010, 642);
      const screenShade = ctx.createLinearGradient(0, 0, 460, 0);
      screenShade.addColorStop(0, "rgba(7, 11, 19, 0.56)");
      screenShade.addColorStop(1, "rgba(7, 11, 19, 0)");
      ctx.fillStyle = screenShade;
      ctx.fillRect(0, 0, 520, 642);
      ctx.restore();
      roundedRect(ctx, 0, 0, 1010, 642, 26);
      ctx.strokeStyle = "rgba(174, 195, 232, 0.28)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      const bottomShade = ctx.createLinearGradient(0, 710, 0, H);
      bottomShade.addColorStop(0, "rgba(7, 11, 19, 0)");
      bottomShade.addColorStop(1, "rgba(7, 11, 19, 0.94)");
      ctx.fillStyle = bottomShade;
      ctx.fillRect(0, 700, W, 300);

      roundedRect(ctx, 94, 76, 66, 66, 14);
      ctx.fillStyle = "rgba(17, 28, 43, 0.92)";
      ctx.fill();
      ctx.save();
      roundedRect(ctx, 94, 76, 66, 66, 14);
      ctx.clip();
      ctx.drawImage(images.logo, 94, 76, 66, 66);
      ctx.restore();

      ctx.fillStyle = "#f4f7fc";
      ctx.font = '600 34px Manrope, "PingFang SC", sans-serif';
      ctx.textBaseline = "middle";
      ctx.fillText("TradeReplay", 181, 109);

      roundedRect(ctx, 1326, 79, 178, 60, 30);
      ctx.fillStyle = "rgba(17, 28, 43, 0.76)";
      ctx.fill();
      ctx.strokeStyle = "rgba(101, 151, 255, 0.5)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#dfe8ff";
      ctx.font = '650 25px ui-monospace, "SFMono-Regular", monospace';
      ctx.textAlign = "center";
      ctx.fillText(`EP. ${episode}`, 1415, 109);
      ctx.textAlign = "left";

      ctx.fillStyle = "#6597ff";
      roundedRect(ctx, 98, 249, 50, 5, 3);
      ctx.fill();
      ctx.fillStyle = "#a7b2c3";
      ctx.font = '650 22px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.letterSpacing = "0.12em";
      ctx.fillText("使用教程 · 入门系列", 98, 213);

      const titleLayout = fittedTitle(title);
      ctx.fillStyle = "#f4f7fc";
      ctx.font = `700 ${titleLayout.size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.textBaseline = "alphabetic";
      ctx.shadowColor = "rgba(0, 0, 0, 0.42)";
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 8;
      const lineHeight = Math.round(titleLayout.size * 1.08);
      const firstBaseline = titleLayout.lines.length === 1 ? 500 : 420;
      titleLayout.lines.forEach((line, index) => {
        ctx.fillText(line, 96, firstBaseline + index * lineHeight);
      });
      ctx.shadowColor = "transparent";
      ctx.letterSpacing = "0em";

      ctx.fillStyle = "#4b83f7";
      ctx.fillRect(96, 834, 6, 56);
      ctx.fillStyle = "#d6dde9";
      ctx.font = '500 28px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textBaseline = "middle";
      ctx.fillText("把盘感练成交易系统", 126, 862);

      ctx.fillStyle = "rgba(167, 178, 195, 0.66)";
      ctx.font = '500 18px Manrope, "PingFang SC", sans-serif';
      ctx.fillText("tradereplay.dev", 126, 913);

      document.body.dataset.ready = "true";
    }

    function safeFilename(text) {
      return text
        .replace(/\s+/g, "-")
        .replace(/[\\/:*?"<>|]/g, "")
        .slice(0, 36) || "cover";
    }

    async function downloadCover() {
      drawCover();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `TradeReplay-EP${episodeInput.value.padStart(2, "0")}-${safeFilename(titleInput.value)}.png`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

    Promise.all([
      loadImage(BACKGROUND_DATA),
      loadImage(SCREEN_DATA),
      loadImage(LOGO_DATA),
      document.fonts.ready
    ]).then(([background, screen, logo]) => {
      images.background = background;
      images.screen = screen;
      images.logo = logo;
      drawCover();
    });

    titleInput.addEventListener("input", drawCover);
    fontSizeInput.addEventListener("input", () => {
      fontSizeValue.value = fontSizeInput.value;
      drawCover();
    });
    fontSizeDecrease.addEventListener("click", () => {
      fontSizeInput.value = Math.max(Number(fontSizeInput.min), Number(fontSizeInput.value) - Number(fontSizeInput.step));
      fontSizeInput.dispatchEvent(new Event("input"));
    });
    fontSizeIncrease.addEventListener("click", () => {
      fontSizeInput.value = Math.min(Number(fontSizeInput.max), Number(fontSizeInput.value) + Number(fontSizeInput.step));
      fontSizeInput.dispatchEvent(new Event("input"));
    });
    episodeInput.addEventListener("input", drawCover);
    downloadButton.addEventListener("click", downloadCover);

    if (renderOnly) document.body.classList.add("render-only");
  </script>
</body>
</html>
