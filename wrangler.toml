name = "tradereplay-site"
compatibility_date = "2025-01-01"
main = "worker/index.mjs"
preview_urls = true

[[routes]]
pattern = "tradereplay.dev/*"
zone_name = "tradereplay.dev"

[[routes]]
pattern = "www.tradereplay.dev/*"
zone_name = "tradereplay.dev"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]
