name: Validate website source

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and publication boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check repository hygiene
        run: node scripts/check-repo-hygiene.mjs

      - name: Build and validate website content
        run: |
          node scripts/build-site-content.mjs
          node scripts/validate-site-content-bindings.mjs
          node scripts/validate-guide-content.mjs
          node scripts/build-guide-content.mjs
          node scripts/validate-public-site.mjs

      - name: Confirm generated files are committed
        run: git diff --exit-code
