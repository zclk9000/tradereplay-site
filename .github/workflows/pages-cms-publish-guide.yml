name: Publish website from Pages CMS

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-cms-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6

      - name: Validate and build website content
        run: |
          node scripts/build-site-content.mjs
          node scripts/validate-site-content-bindings.mjs

      - name: Validate guide content
        run: node scripts/validate-guide-content.mjs

      - name: Build browser content
        run: node scripts/build-guide-content.mjs

      - name: Deploy current website to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          command: deploy --message "Pages CMS publish current website"
