name: Publish website from Pages CMS

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pages-cms-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check repository hygiene
        run: node scripts/check-repo-hygiene.mjs

      - name: Validate and build website content
        run: |
          node scripts/build-site-content.mjs
          node scripts/validate-site-content-bindings.mjs

      - name: Validate guide content
        run: node scripts/validate-guide-content.mjs

      - name: Build browser content
        run: node scripts/build-guide-content.mjs

      - name: Validate publication boundary and local links
        run: node scripts/validate-public-site.mjs

      - name: Confirm only generated browser files changed
        shell: bash
        run: |
          unexpected="$(git status --short --untracked-files=all -- . \
            ':(exclude)public/scripts/site-content.generated.js' \
            ':(exclude)public/data/guide-content.json')"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed while rebuilding content:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated browser files when needed
        shell: bash
        run: |
          if git diff --quiet -- \
            public/scripts/site-content.generated.js \
            public/data/guide-content.json; then
            echo "Generated browser content is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public/scripts/site-content.generated.js \
            public/data/guide-content.json
          git commit -m "chore(cms): rebuild published content"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deploy current website to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          command: deploy --message "Pages CMS publish current website"
