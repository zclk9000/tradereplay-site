name: Publish guide from Pages CMS

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-cms-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6

      - name: Validate guide content
        run: node scripts/validate-guide-content.mjs

      - name: Build browser content
        run: node scripts/build-guide-content.mjs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
