name: Preview guide from Pages CMS

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-cms-preview
  cancel-in-progress: true

jobs:
  validate-and-preview:
    name: Validate and create preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6

      - name: Validate guide content
        run: node scripts/validate-guide-content.mjs

      - name: Build browser content
        run: node scripts/build-guide-content.mjs

      - name: Upload preview version to Cloudflare Workers
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.115.0"
          command: versions upload --preview-alias guide-preview --message "Pages CMS tutorial preview"
