media:
  - name: site_media
    label: 官网图片
    input: public/assets/cms
    output: /assets/cms
    categories: [image]
    rename: safe
    commit:
      templates:
        create: "content(site): 添加图片 {filename}"
        update: "content(site): 更新图片 {filename}"
        delete: "content(site): 删除图片 {filename}"
        rename: "content(site): 重命名图片 {oldFilename} 为 {newFilename}"

  - name: guide_media
    label: 教程图片与视频
    input: public/guide-assets
    output: /guide-assets
    categories: [image, video]
    rename: safe
    commit:
      templates:
        create: "docs(media): 添加 {filename}"
        update: "docs(media): 更新 {filename}"
        delete: "docs(media): 删除 {filename}"
        rename: "docs(media): 重命名 {oldFilename} 为 {newFilename}"

components:
  localized_short:
    type: object
    fields:
      - name: zh
        label: 中文
        type: string
        required: true
      - name: en
        label: English
        type: string
        required: true

  localized_text:
    type: object
    fields:
      - name: zh
        label: 中文
        type: text
        required: true
      - name: en
        label: English
        type: text
        required: true

  site_button:
    type: object
    fields:
      - name: label
        label: 按钮文字
        component: localized_short
      - name: href
        label: 按钮链接
        component: localized_short

  showcase_item:
    type: object
    fields:
      - name: tab
        label: 标签名称
        component: localized_short
      - name: title
        label: 标题
        component: localized_short
      - name: bullets
        label: 功能要点
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{zh}"
        fields:
          - name: zh
            label: 中文
            type: text
            required: true
          - name: en
            label: English
            type: text
            required: true
      - name: image
        label: 展示图片
        type: image
        required: true
        options:
          media: site_media
          extensions: [png, jpg, jpeg, webp]
          rename: safe
      - name: imageAlt
        label: 图片说明
        component: localized_text

  release_platform:
    type: object
    fields:
      - name: url
        label: 下载链接
        type: string
        required: true
        description: 必须使用 https:// 完整链接。
      - name: fileName
        label: 安装包文件名
        type: string
        required: true
      - name: installerLabel
        label: 安装包标签
        type: string
        required: true
        description: 例如“.exe · v1.53.0”。
      - name: summary
        label: 平台说明
        component: localized_text
      - name: button
        label: 下载按钮
        component: localized_short

  rich_text:
    type: rich-text
    options:
      format: html
      switcher: true
      media: guide_media
      extensions: [png, jpg, jpeg, webp, gif]
      rename: safe

  article_sections:
    type: object
    label: 正文章节
    list:
      collapsible:
        collapsed: true
        summary: "{title}"
    fields:
      - name: id
        label: 章节锚点
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "只能使用小写字母、数字和短横线"
        description: 已发布后不要修改，否则旧的章节链接会失效。
      - name: title
        label: 章节标题
        type: string
        required: true
      - name: body
        label: 正文
        component: rich_text
        description: 可直接排版文字、加粗、添加链接，也可以在正文中插入图片。
      - name: steps
        label: 操作步骤
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {title}"
        fields:
          - name: title
            label: 步骤标题
            type: string
            required: true
          - name: body
            label: 步骤说明
            component: rich_text
      - name: bullets
        label: 要点列表
        type: text
        list: true
      - name: callout
        label: 提示框
        type: object
        fields:
          - name: tone
            label: 提示类型
            type: select
            options:
              values:
                - name: note
                  label: 普通说明
                - name: tip
                  label: 操作技巧
                - name: warning
                  label: 注意事项
                - name: security
                  label: 安全提醒
          - name: title
            label: 提示标题
            type: string
          - name: body
            label: 提示内容
            component: rich_text
      - name: media
        label: 章节截图或视频
        type: object
        fields:
          - name: type
            label: 素材类型
            type: select
            options:
              values:
                - name: image
                  label: 图片 / 截图
                - name: video
                  label: 视频
          - name: label
            label: 素材标题
            type: string
            description: 显示在图片或视频下方。
          - name: file
            label: 上传或选择素材
            type: file
            options:
              media: guide_media
              categories: [image, video]
              rename: safe
          - name: poster
            label: 视频封面（可选）
            type: image
            options:
              media: guide_media
              extensions: [png, jpg, jpeg, webp]
              rename: safe
          - name: ready
            label: 在网站显示真实素材
            type: boolean
            default: false
            description: 上传并检查完成后打开；关闭时正式网站不会显示这项素材。
          - name: alt
            label: 图片无障碍说明
            type: string
            description: 简短描述图片内容，不要写“图片”或“截图”。
          - name: note
            label: 拍摄或补充说明
            type: text
            description: 仅供内部制作参考，不会显示在正式网站。

  article_faq:
    type: object
    label: 常见问题
    list:
      collapsible:
        collapsed: true
        summary: "{q}"
    fields:
      - name: q
        label: 问题
        type: string
        required: true
      - name: a
        label: 答案
        component: rich_text
        required: true

content:
  - name: website_content
    label: 官网内容
    type: group
    items:
      - name: home_content
        label: 首页文字与图片
        type: file
        path: content/site/home.json
        format: json
        operations:
          delete: false
        fields:
          - name: hero
            label: 首屏
            type: object
            fields:
              - name: eyebrow
                label: 顶部短句
                component: localized_short
              - name: title
                label: 主标题
                component: localized_short
              - name: subtitle
                label: 副标题
                component: localized_text
              - name: primaryButton
                label: 主按钮
                component: site_button
              - name: secondaryButton
                label: 次按钮
                component: site_button
              - name: image
                label: 首屏图片
                type: image
                required: true
                options:
                  media: site_media
                  extensions: [png, jpg, jpeg, webp]
                  rename: safe
              - name: imageAlt
                label: 首屏图片说明
                component: localized_text
          - name: showcase
            label: 六个核心能力
            type: object
            fields:
              - name: kicker
                label: 栏目短标题
                component: localized_short
              - name: title
                label: 栏目标题
                component: localized_short
              - name: intro
                label: 栏目介绍
                component: localized_text
              - name: system
                label: 01 定制系统
                component: showcase_item
              - name: simulation
                label: 02 模拟交易
                component: showcase_item
              - name: scan
                label: 03 策略扫描
                component: showcase_item
              - name: statements
                label: 04 账单分析
                component: showcase_item
              - name: statistics
                label: 05 统计与 AI
                component: showcase_item
              - name: journal
                label: 06 日志与同步
                component: showcase_item
          - name: pricing
            label: 版本与购买
            type: object
            fields:
              - name: kicker
                label: 栏目短标题
                component: localized_short
              - name: title
                label: 栏目标题
                component: localized_short
              - name: proLicense
                label: Pro 授权说明
                component: localized_short
              - name: purchaseLabel
                label: 购买按钮文字
                component: localized_short
              - name: taobaoUrl
                label: 中文购买链接（淘宝）
                type: string
                required: true
              - name: whopUrl
                label: 英文购买链接（Whop）
                type: string
                required: true
          - name: finalCta
            label: 页面底部行动区
            type: object
            fields:
              - name: kicker
                label: 顶部短句
                component: localized_short
              - name: title
                label: 标题
                component: localized_short
              - name: description
                label: 说明
                component: localized_text

      - name: release_content
        label: 下载与更新日志
        type: file
        path: content/site/release.json
        format: json
        operations:
          delete: false
        fields:
          - name: version
            label: 版本号
            type: string
            required: true
            description: 不含 v，例如“1.53.0”。
          - name: displayVersion
            label: 显示版本号
            type: string
            required: true
            description: 例如“v1.53.0”。
          - name: date
            label: 发布日期
            type: string
            required: true
            pattern:
              regex: "^\\d{4}-\\d{2}-\\d{2}$"
              message: "请使用 YYYY-MM-DD 格式"
          - name: downloadIntro
            label: 下载页说明
            component: localized_text
          - name: windows
            label: Windows 安装包
            component: release_platform
          - name: mac
            label: macOS 安装包
            component: release_platform
          - name: highlights
            label: 本次更新内容
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{type} · {zh}"
            fields:
              - name: type
                label: 类型
                type: select
                required: true
                options:
                  values:
                    - name: new
                      label: 新增
                    - name: improved
                      label: 优化
                    - name: fixed
                      label: 修复
              - name: zh
                label: 中文说明
                type: text
                required: true
              - name: en
                label: English
                type: text
                required: true

      - name: support_content
        label: 教程入口与支持渠道
        type: file
        path: content/site/support.json
        format: json
        operations:
          delete: false
        fields:
          - name: heading
            label: 支持页标题
            component: localized_short
          - name: guide
            label: 教程入口
            type: object
            fields:
              - name: title
                label: 标题
                component: localized_short
              - name: description
                label: 说明
                component: localized_text
              - name: link
                label: 教程链接
                component: localized_short
              - name: button
                label: 按钮文字
                component: localized_short
          - name: qq
            label: QQ 售后群
            type: object
            fields:
              - name: title
                label: 标题
                component: localized_short
              - name: number
                label: 群号
                type: string
                required: true
              - name: joinUrl
                label: 加群链接
                type: string
                required: true
              - name: button
                label: 按钮文字
                component: localized_short
              - name: qrImage
                label: 群二维码
                type: image
                required: true
                options:
                  media: site_media
                  extensions: [png, jpg, jpeg, webp]
                  rename: safe
              - name: iconImage
                label: QQ 图标
                type: image
                required: true
                options:
                  media: site_media
                  extensions: [png, jpg, jpeg, webp]
                  rename: safe
          - name: wecom
            label: 企业微信售后群
            type: object
            fields:
              - name: title
                label: 标题
                component: localized_short
              - name: description
                label: 显示说明
                component: localized_short
              - name: button
                label: 按钮文字
                component: localized_short
              - name: qrImage
                label: 群二维码
                type: image
                required: true
                options:
                  media: site_media
                  extensions: [png, jpg, jpeg, webp]
                  rename: safe
              - name: iconImage
                label: 企业微信图标
                type: image
                required: true
                options:
                  media: site_media
                  extensions: [png, jpg, jpeg, webp]
                  rename: safe
          - name: email
            label: 支持邮箱
            type: string
            required: true

      - name: legal_content
        label: 政策页设置
        type: file
        path: content/site/legal.json
        format: json
        operations:
          delete: false
        fields:
          - name: updated
            label: 更新日期文案
            component: localized_short
          - name: supportEmail
            label: 政策联系邮箱
            type: string
            required: true
          - name: privacyDescription
            label: 隐私政策页面说明
            component: localized_text
          - name: termsDescription
            label: 服务条款页面说明
            component: localized_text
          - name: refundDescription
            label: 退款政策页面说明
            component: localized_text

  - name: guide_center
    label: 教程中心
    type: group
    items:
      - name: guide_articles
        label: 教程文章
        type: collection
        path: content/guide/articles
        format: json
        filename:
          template: "{id}.json"
          field: false
        operations:
          create: false
          rename: false
          delete: false
        view:
          fields: [code, title, status, category]
          primary: title
          search: [code, title, summary, keywords]
          sort: [code, title, status, category]
          default:
            sort: code
            order: asc
        fields:
          - name: id
            label: 文章 ID
            type: string
            required: true
            readonly: true
            description: 网站链接使用的永久编号。
          - name: code
            label: 教程编号
            type: string
            required: true
            readonly: true
          - name: category
            label: 所属分类
            type: select
            required: true
            options:
              values:
                - name: quick-start
                  label: 01 快速开始
                - name: data-sessions
                  label: 02 行情数据与训练存档
                - name: chart-replay
                  label: 03 图表回放与复盘地图
                - name: trading-risk
                  label: 04 下单、持仓与风险管理
                - name: review-journal
                  label: 05 交易历史、笔记与日志
                - name: account-import
                  label: 06 真实账户与账单导入
                - name: statistics
                  label: 07 统计分析与交易诊断
                - name: strategy-backtest
                  label: 08 指标、策略系统与回测
                - name: mentor-achievements
                  label: 09 Mentor AI 与成就
                - name: settings-security
                  label: 10 设置、授权与数据安全
                - name: troubleshooting
                  label: 11 故障排查与概念词典
          - name: title
            label: 文章标题
            type: string
            required: true
            options:
              maxlength: 90
          - name: summary
            label: 列表摘要
            type: text
            required: true
            options:
              maxlength: 180
          - name: status
            label: 发布状态
            type: select
            required: true
            options:
              values:
                - name: planned
                  label: 计划中（不在官网显示）
                - name: ready
                  label: 已完成（可以阅读）
          - name: featured
            label: 在首页重点推荐
            type: boolean
            default: false
          - name: time
            label: 预计阅读时间
            type: string
            required: true
            description: 例如“5 分钟”。
          - name: level
            label: 难度
            type: select
            required: true
            options:
              values: [入门, 进阶, 高级, 排错]
          - name: tier
            label: 适用版本
            type: string
            required: true
            description: 例如“免费版可用”或“Pro”。
          - name: platform
            label: 适用平台
            type: string
            required: true
            description: 例如“macOS / Windows”。
          - name: keywords
            label: 搜索关键词
            type: string
            list: true
            description: 添加用户可能会搜索的功能名、提示语或错误词。
          - name: outcome
            label: 完成后
            type: text
            description: 用一句话告诉读者完成教程后会得到什么。
          - name: before
            label: 开始之前
            type: text
            list: true
          - name: sections
            component: article_sections
          - name: success
            label: 成功后你会看到
            type: text
            list: true
          - name: faq
            component: article_faq
          - name: related
            label: 相关文章
            type: reference
            options:
              collection: guide_articles
              multiple: true
              search: "code,title,keywords"
              value: "{fields.id}"
              label: "{fields.code} · {fields.title}"

      - name: guide_catalog
        label: 分类与版本设置
        type: file
        path: content/guide/catalog.json
        format: json
        operations:
          delete: false
        fields:
          - name: version
            label: 已核对的软件版本
            type: string
            required: true
            description: 教程内容最后按哪个 TradeReplay 版本核对。
          - name: verifiedDate
            label: 最后核对日期
            type: string
            required: true
            pattern:
              regex: "^\\d{4}-\\d{2}-\\d{2}$"
              message: "请使用 YYYY-MM-DD 格式"
          - name: articleFiles
            label: 文章数据文件
            type: string
            list: true
            hidden: true
          - name: categories
            label: 教程分类
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{number} · {title}"
            fields:
              - name: id
                label: 分类 ID
                type: string
                required: true
                readonly: true
              - name: number
                label: 分类编号
                type: string
                required: true
              - name: title
                label: 完整名称
                type: string
                required: true
              - name: short
                label: 导航短名称
                type: string
                required: true
              - name: description
                label: 分类说明
                type: text
                required: true
              - name: count
                label: 内部规划文章数
                type: number
                required: true
              - name: tone
                label: 配色
                type: select
                required: true
                options:
                  values: [blue, cyan, indigo, amber, teal]
              - name: icon
                label: 图标
                type: select
                required: true
                options:
                  values: [compass, database, chart, shield, notebook, receipt, activity, workflow, spark, sliders, lifebuoy]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "docs(cms): 新建 {path}"
      update: "docs(cms): 更新 {path}"
      delete: "docs(cms): 删除 {path}"
      rename: "docs(cms): 重命名 {oldPath} 为 {newPath}"

actions:
  - name: publish-site
    label: 发布当前官网（含教程）
    workflow: pages-cms-publish-guide.yml
    ref: current
    cancelable: true
    confirm:
      title: 发布到正式官网吗？
      message: 系统会先检查官网内容与全部教程，再把 GitHub main 中的当前官网和教程统一发布到 tradereplay.dev。通常需要约 1–2 分钟。
      button: 确认发布官网
